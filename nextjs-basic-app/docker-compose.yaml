services:
  postgrel-database:
    image: postgres:latest
    container_name: next-basic-app-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin54321
      - POSTGRES_DB=nextBasicApp
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  postgres_data:
    driver: local
